# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'

reviews:
  profile: 'chill'
  request_changes_workflow: false
  commit_status: true
  fail_commit_status: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_filters:
    - '!src/graphql/generated/**'
    - '!src/routeTree.gen.ts'
    - '!schema/schema.graphql'
    - '!src/shared/ui/**'
    - '!public/**'
    - '!pnpm-lock.yaml'

  path_instructions:
    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        React + TanStack Router/Query SPA. docs/guide/architecture-conventions.md가 기준입니다.
        - shared는 features를 import하면 안 되고, feature 간 import는 대상 index.ts로만 가능합니다.
        - 쿼리 키는 feature의 키 팩토리로만 만들고, mutation 뒤 관련 키를 invalidate해야 합니다. 낙관적 업데이트는 쓰지 않습니다.
        - accessToken을 localStorage/sessionStorage에 저장하면 안 됩니다.
        - GraphQL ID는 문자열 그대로 다루며 "0"·빈 문자열을 truthy 검사로 버리면 안 됩니다.
        - 색상 hex를 컴포넌트에 직접 쓰지 않고 globals.css 토큰을 씁니다.
        - 기능 변경에는 테스트(MSW 기반)가 함께 있는지 확인하세요.
    - path: 'src/**/*.graphql'
      instructions: |
        문서는 schema/schema.graphql(BE 스냅샷)과 일치해야 합니다. 필드 과다 조회·중복 문서를 지적하세요.
    - path: '.github/workflows/**/*.yml'
      instructions: |
        GitHub Actions는 최소 권한, 시크릿 노출 방지, fork 안전성, SHA 핀을 중심으로 리뷰하세요.
    - path: 'infra/**'
      instructions: |
        compose·nginx·배포 스크립트는 인바운드 포트 미개방, 헬스체크, 롤백 가능성, 시크릿 처리를 중심으로 리뷰하세요.
    - path: 'src/**/*.spec.{ts,tsx}'
      instructions: |
        네트워크는 MSW로 mock했는지, 정상 흐름뿐 아니라 에러·경계 케이스가 있는지 확인하세요.

  pre_merge_checks:
    title:
      mode: warning
      requirements: 'PR 제목은 Conventional Commits 형식으로 변경 내용을 간결하게 설명해야 합니다.'
    description:
      mode: off

knowledge_base:
  code_guidelines:
    enabled: true
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  web_search:
    enabled: true

chat:
  auto_reply: false
