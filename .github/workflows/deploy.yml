name: Deploy

# 홈서버 자동 배포. Build Image가 main에서 성공하면 셀프호스트 러너(맥미니)가 .env 생성 → deploy.sh(pull·up·healthy) → Discord.
# 롤백 = workflow_dispatch에 이전 sha. BE deploy.yml과 같은 구조(마이그레이션·앱 시크릿은 없다).
on:
  workflow_run:
    workflows: [Build Image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그(전체 sha). 비우면 지금 main 끝 커밋'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, macmini]
    environment: production
    timeout-minutes: 15
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/caquick-admin' }}
      IMAGE: ghcr.io/caquick/caquick-admin-fe

    steps:
      - name: Checkout (infra만)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: infra
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Resolve image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then tag=$INPUT_TAG
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then tag=$MAIN_SHA
          else tag=$RUN_SHA; fi
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]] || { echo "image_tag은 전체 커밋 sha(40 hex)만: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Skip if not the current main head
        if: github.event_name == 'workflow_run'
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          if [ "$RUN_SHA" != "$MAIN_SHA" ]; then
            echo "main 끝($MAIN_SHA)이 아닌 빌드($RUN_SHA) — 배포 건너뜀"
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      # 맥 러너의 docker CLI가 키체인 helper로 login에 실패하지 않게 잡 전용 DOCKER_CONFIG(BE와 동일)
      - name: Isolated docker config (no keychain helper)
        if: env.SKIP_DEPLOY != '1'
        run: |
          set -euo pipefail
          host=$(docker context inspect --format '{{ .Endpoints.docker.Host }}')
          dir="$RUNNER_TEMP/docker-config"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '{"auths":{"ghcr.io":{}}}\n' > "$dir/config.json"
          [ -d "$HOME/.docker/cli-plugins" ] && ln -s "$HOME/.docker/cli-plugins" "$dir/cli-plugins"
          DOCKER_CONFIG=$dir DOCKER_HOST=$host docker compose version > /dev/null
          { echo "DOCKER_CONFIG=$dir"; echo "DOCKER_HOST=$host"; } >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: env.SKIP_DEPLOY != '1'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync infra/ + write .env (600)
        if: env.SKIP_DEPLOY != '1'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          # 진단용 호스트 포트(127.0.0.1). 호스트의 다른 컨테이너와 겹치면 Environment 변수로 바꾼다
          ADMIN_HOST_PORT: ${{ vars.ADMIN_HOST_PORT || '8090' }}
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete --exclude '.env' infra/ "$DEPLOY_DIR/"
          umask 077
          tmp=$(mktemp "$DEPLOY_DIR/.env.XXXXXX")
          printf 'IMAGE=%s\nIMAGE_TAG=%s\nADMIN_HOST_PORT=%s\n' "$IMAGE" "$IMAGE_TAG" "$ADMIN_HOST_PORT" > "$tmp"
          chmod 600 "$tmp" && mv -f "$tmp" "$DEPLOY_DIR/.env"

      - name: Deploy
        if: env.SKIP_DEPLOY != '1'
        run: bash "$DEPLOY_DIR/deploy.sh"
        working-directory: ${{ env.DEPLOY_DIR }}

      - name: Discord
        if: always() && env.SKIP_DEPLOY != '1'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || { echo "DISCORD_WEBHOOK_URL 없음 — 알림 생략"; exit 0; }
          if [ "$STATUS" = "success" ]; then color=3066993; title="배포 성공"; else color=15158332; title="배포 실패"; fi
          payload=$(printf '{"embeds":[{"title":"%s","description":"caquick-admin-fe %s\\n%s","color":%s}]}' "$title" "$TAG" "$RUN_URL" "$color")
          curl -fsS -H 'content-type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL" > /dev/null || echo "Discord 전송 실패"
